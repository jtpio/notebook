name: Binder Badge
on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read

jobs:
  binder:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: jupyterlab/maintainer-tools/.github/actions/binder-link@4016d4e69656e13e662d629ee3c30dc31e68628f # v1.1.1
        with:
          github_token: ${{ secrets.github_token }}
          url_path: tree
