name: Binder Badge
on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read

jobs:
  binder:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: jupyterlab/maintainer-tools/.github/actions/binder-link@925e40fa6066f4533e0c40803bd4b6d0d2f4a781 # v1.1.0
        with:
          github_token: ${{ secrets.github_token }}
          url_path: tree
